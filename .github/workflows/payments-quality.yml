name: payments-quality

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "apps/admin/**"
      - "e2e/**"
      - "docs/STRIPE-FEATURES.md"
      - "package.json"
      - "package-lock.json"
      - "jest.config.js"
      - "jest.setup.js"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".github/workflows/payments-quality.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "apps/admin/**"
      - "e2e/**"
      - "docs/STRIPE-FEATURES.md"
      - "package.json"
      - "package-lock.json"
      - "jest.config.js"
      - "jest.setup.js"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".github/workflows/payments-quality.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Core payments quality validation
        run: npm run validate:payments:core

      - name: Publish payment coverage summary
        if: always()
        run: npm run report:payments:coverage

      - name: Upload payment coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payments-coverage-artifacts
          path: coverage/
          if-no-files-found: ignore
